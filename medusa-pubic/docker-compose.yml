name: my-medusa-store-production

# Production stack using the prebuilt Docker Hub images.
# PostgreSQL imports init.sql only when postgres_data is created for the first time.
services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend-migrate:
    image: nguyenhuynh04/my-medusa-store-backend:latest
    platform: linux/amd64
    pull_policy: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["pnpm", "exec", "medusa", "db:migrate", "--execute-safe-links"]
    restart: "no"

  backend:
    image: nguyenhuynh04/my-medusa-store-backend:latest
    platform: linux/amd64
    pull_policy: always
    env_file:
      - .env
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  realtime:
    image: nguyenhuynh04/my-medusa-store-backend:latest
    platform: linux/amd64
    pull_policy: always
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    command: ["pnpm", "exec", "ts-node", "src/realtime/server.ts"]
    ports:
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  storefront:
    image: nguyenhuynh04/my-medusa-store-storefront:latest
    platform: linux/amd64
    # Storefront embeds NEXT_PUBLIC_* at build time, so build this image on the
    # target amd64 host with the production domains and do not pull an old image.
    pull_policy: never
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8000').then(r => { if (r.status >= 500) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  chatbot-service:
    image: nguyenhuynh04/my-medusa-store-chatbot-service:latest
    platform: linux/amd64
    pull_policy: always
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      storefront:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
