services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://host.docker.internal:9000}
        NEXT_PUBLIC_BASE_URL: ${STOREFRONT_URL}
        NEXT_PUBLIC_DIALOGFLOW_PROJECT_ID: ${NEXT_PUBLIC_DIALOGFLOW_PROJECT_ID:-leanning-495806}
        NEXT_PUBLIC_DIALOGFLOW_AGENT_ID: ${NEXT_PUBLIC_DIALOGFLOW_AGENT_ID:-49eca4ed-a835-4988-8a1a-45597562a831}
    container_name: storefront
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: always

  chatbot-service:
    build:
      context: .
      dockerfile: chatbot-service/Dockerfile
    container_name: chatbot-service
    depends_on:
      backend:
        condition: service_healthy
      storefront:
        condition: service_started
    env_file:
      - .env
    environment:
      MEDUSA_BASE_URL: http://backend:9000
      STOREFRONT_INTERNAL_URL: http://storefront:8000
    ports:
      - "8080:8080"
    restart: always

volumes:
  postgres_data:
  redis_data:
