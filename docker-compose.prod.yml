services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}
      MEDUSA_BACKEND_URL: http://backend:9000
      MEDUSA_INTERNAL_URL: http://backend:9000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${PUBLIC_BACKEND_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}:9000}
      CHATBOT_SERVICE_URL: http://chatbot-service:8080/webhook
      CHAT_REALTIME_URL: http://backend:9001
      CHAT_REALTIME_PORT: 9001
      VITE_CHAT_WS_URL: ${PUBLIC_CHAT_WS_ORIGIN:-${PUBLIC_CHAT_WS_PROTOCOL:-ws}://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}:9001}
      STORE_CORS: ${PUBLIC_STOREFRONT_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}:8000}
      ADMIN_CORS: ${PUBLIC_BACKEND_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}:9000}
      AUTH_CORS: ${PUBLIC_BACKEND_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}:9000},${PUBLIC_STOREFRONT_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}:8000}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${PUBLIC_BACKEND_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}:9000}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY in .env.prod}
        NEXT_PUBLIC_BASE_URL: ${PUBLIC_STOREFRONT_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}:8000}
        NEXT_PUBLIC_CHAT_WS_URL: ${PUBLIC_CHAT_WS_ORIGIN:-}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-vn}
    container_name: storefront
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}
      MEDUSA_BACKEND_URL: http://backend:9000
      STOREFRONT_INTERNAL_URL: http://storefront:8000
      CHATBOT_SERVICE_URL: http://chatbot-service:8080/webhook
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${PUBLIC_BACKEND_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}:9000}
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_STOREFRONT_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}:8000}
      NEXT_PUBLIC_CHAT_WS_URL: ${PUBLIC_CHAT_WS_ORIGIN:-}
    ports:
      - "8000:8000"
    restart: always

  chatbot-service:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    container_name: chatbot-service
    depends_on:
      backend:
        condition: service_healthy
      storefront:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}
      MEDUSA_BASE_URL: http://backend:9000
      MEDUSA_BACKEND_URL: http://backend:9000
      STOREFRONT_INTERNAL_URL: http://storefront:8000
      STOREFRONT_BASE_URL: ${PUBLIC_STOREFRONT_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.prod}:8000}
      MEDUSA_REGION_COUNTRY_CODE: vn
      STOREFRONT_COUNTRY_CODE: vn
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-10}
      GEMINI_RATE_LIMIT_COOLDOWN_SECONDS: ${GEMINI_RATE_LIMIT_COOLDOWN_SECONDS:-60}
      CHATBOT_TRACE_ENABLED: ${CHATBOT_TRACE_ENABLED:-false}
      CHATBOT_TRACE_MAX_STRING_CHARS: ${CHATBOT_TRACE_MAX_STRING_CHARS:-4000}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: always

volumes:
  postgres_data:
  redis_data:
