services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: my-medusa-store-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        VITE_CHAT_WS_URL: ${VITE_CHAT_WS_URL:?Set VITE_CHAT_WS_URL in .env}
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:?Set NEXT_PUBLIC_MEDUSA_BACKEND_URL in .env}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?Set NEXT_PUBLIC_BASE_URL in .env}
    container_name: backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MEDUSA_INTERNAL_URL: ${MEDUSA_INTERNAL_URL:?Set MEDUSA_INTERNAL_URL in .env}
      CHATBOT_SERVICE_URL: ${CHATBOT_SERVICE_URL:?Set CHATBOT_SERVICE_URL in .env}
      CHAT_REALTIME_URL: ${CHAT_REALTIME_URL:?Set CHAT_REALTIME_URL in .env}
      CHAT_REALTIME_PORT: ${CHAT_REALTIME_PORT:?Set CHAT_REALTIME_PORT in .env}
      VITE_CHAT_WS_URL: ${VITE_CHAT_WS_URL:?Set VITE_CHAT_WS_URL in .env}
      STORE_CORS: ${STORE_CORS:?Set STORE_CORS in .env}
      ADMIN_CORS: ${ADMIN_CORS:?Set ADMIN_CORS in .env}
      AUTH_CORS: ${AUTH_CORS:?Set AUTH_CORS in .env}
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  realtime:
    image: my-medusa-store-backend
    container_name: realtime
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CHAT_REALTIME_PORT: ${CHAT_REALTIME_PORT:?Set CHAT_REALTIME_PORT in .env}
      MEDUSA_INTERNAL_URL: ${MEDUSA_INTERNAL_URL:?Set MEDUSA_INTERNAL_URL in .env}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY in .env}
    command: ["pnpm", "exec", "ts-node", "src/realtime/server.ts"]
    ports:
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:?Set NEXT_PUBLIC_MEDUSA_BACKEND_URL in .env}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY in .env}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?Set NEXT_PUBLIC_BASE_URL in .env}
        NEXT_PUBLIC_CHAT_WS_URL: ${NEXT_PUBLIC_CHAT_WS_URL:?Set NEXT_PUBLIC_CHAT_WS_URL in .env}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-vn}
    container_name: storefront
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:?Set MEDUSA_BACKEND_URL in .env}
      STOREFRONT_INTERNAL_URL: ${STOREFRONT_INTERNAL_URL:?Set STOREFRONT_INTERNAL_URL in .env}
      CHATBOT_SERVICE_URL: ${CHATBOT_SERVICE_URL:?Set CHATBOT_SERVICE_URL in .env}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:?Set NEXT_PUBLIC_MEDUSA_BACKEND_URL in .env}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?Set NEXT_PUBLIC_BASE_URL in .env}
      NEXT_PUBLIC_CHAT_WS_URL: ${NEXT_PUBLIC_CHAT_WS_URL:?Set NEXT_PUBLIC_CHAT_WS_URL in .env}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  chatbot-service:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    container_name: chatbot-service
    depends_on:
      backend:
        condition: service_healthy
      storefront:
        condition: service_started
    env_file:
      - .env
    environment:
      MEDUSA_BASE_URL: ${MEDUSA_BASE_URL:?Set MEDUSA_BASE_URL in .env}
      STOREFRONT_INTERNAL_URL: ${STOREFRONT_INTERNAL_URL:?Set STOREFRONT_INTERNAL_URL in .env}
      STOREFRONT_BASE_URL: ${STOREFRONT_BASE_URL:?Set STOREFRONT_BASE_URL in .env}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
