services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecomoi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres && (psql -U postgres -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='ecomoi'\" | grep -q 1 || createdb -U postgres ecomoi)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: base
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      CHAT_REALTIME_URL: http://localhost:9001
      CHAT_REALTIME_PORT: 9001
      VITE_CHAT_WS_URL: ${PUBLIC_CHAT_WS_ORIGIN:-${PUBLIC_CHAT_WS_PROTOCOL:-ws}://${PUBLIC_HOST:-localhost}:9001}
      MEDUSA_INTERNAL_URL: http://localhost:9000
      CHATBOT_SERVICE_URL: http://chatbot-service:8080/webhook
      MEDUSA_ADMIN_ONBOARDING_TYPE: nextjs
      MEDUSA_ADMIN_ONBOARDING_NEXTJS_DIRECTORY: apps/storefront
      STORE_CORS: ${PUBLIC_STOREFRONT_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:-localhost}:8000}
      ADMIN_CORS: http://localhost:5173,${PUBLIC_BACKEND_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:-localhost}:9000}
      AUTH_CORS: http://localhost:5173,${PUBLIC_BACKEND_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:-localhost}:9000},${PUBLIC_STOREFRONT_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:-localhost}:8000}
      PNPM_HOME: /pnpm
    ports:
      - "9000:9000"
      - "7001:7001"
      - "9001:9001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    volumes:
      - .:/app
      - backend_root_node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - backend_pnpm_store:/pnpm/store
    command: >
      sh -c "corepack enable &&
             ln -sfn /app/apps /apps &&
             pnpm config set store-dir /pnpm/store &&
             pnpm install --frozen-lockfile &&
             rm -rf apps/backend/node_modules/.vite apps/backend/.medusa/client apps/backend/.medusa/server apps/backend/.medusa/admin &&
             pnpm --filter @dtc/backend exec medusa db:migrate --execute-safe-links &&
             (pnpm --filter @dtc/backend exec ts-node src/realtime/server.ts &) &&
             pnpm --filter @dtc/backend dev"

  storefront:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: base
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      MEDUSA_BACKEND_URL: http://backend:9000
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_STOREFRONT_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:-localhost}:8000}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${PUBLIC_BACKEND_ORIGIN:-${PUBLIC_PROTOCOL:-http}://${PUBLIC_HOST:-localhost}:9000}
      NEXT_PUBLIC_CHAT_WS_URL: ${PUBLIC_CHAT_WS_ORIGIN:-${PUBLIC_CHAT_WS_PROTOCOL:-ws}://${PUBLIC_HOST:-localhost}:9001}
      NEXT_PUBLIC_STRIPE_KEY: ""
      PNPM_HOME: /pnpm
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - storefront_root_node_modules:/app/node_modules
      - storefront_node_modules:/app/apps/storefront/node_modules
      - storefront_pnpm_store:/pnpm/store
    command: >
      sh -c "corepack enable &&
             pnpm config set store-dir /pnpm/store &&
             pnpm install --frozen-lockfile &&
             pnpm --filter @dtc/storefront dev"

  chatbot-service:
    build:
      context: ./chatbot-service
    depends_on:
      backend:
        condition: service_healthy
      storefront:
        condition: service_started
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      MEDUSA_BASE_URL: http://backend:9000
      STOREFRONT_INTERNAL_URL: http://storefront:8000
      MEDUSA_REGION_COUNTRY_CODE: vn
      MEDUSA_TIMEOUT_SECONDS: 8
      STOREFRONT_COUNTRY_CODE: vn
      GEMINI_TIMEOUT_SECONDS: 10
      CHATBOT_TRACE_ENABLED: "true"
      CHATBOT_TRACE_MAX_STRING_CHARS: 4000
      AI_COST_TRACKING_ENABLED: "true"
      LEX_TEXT_REQUEST_PRICE_USD: 0.00075
      GEMINI_INPUT_PRICE_PER_1M_TOKENS_USD: 0.30
      GEMINI_OUTPUT_PRICE_PER_1M_TOKENS_USD: 2.50
      LAMBDA_MEMORY_SIZE_MB: 128
      LAMBDA_REQUEST_PRICE_PER_1M_USD: 0.20
      LAMBDA_DURATION_PRICE_PER_GB_SECOND_USD: 0.0000166667
      AI_USAGE_SNAPSHOT_JOB_ENABLED: "true"
      AI_USAGE_SNAPSHOT_INTERVAL_SECONDS: 3600
    ports:
      - "8080:8080"
    volumes:
      - ./chatbot-service:/app

  ngrok:
    image: ngrok/ngrok:latest
    depends_on:
      chatbot-service:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./.ngrok.docker.yml:/etc/ngrok.yml:ro
    command: ["start", "app", "--config", "/etc/ngrok.yml"]
    ports:
      - "4040:4040"

volumes:
  postgres_data:
  redis_data:
  backend_root_node_modules:
  backend_node_modules:
  backend_pnpm_store:
  storefront_root_node_modules:
  storefront_node_modules:
  storefront_pnpm_store:
